<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="HTML_form.css">
    <title>HTML form</title>
</head>
<body>
<div class="name">
    <p>
        Name:
    </p>
    <input type="Name">
</div>
<div class="sex">
    <p>Sex:</p>
    <div class="male">
        <p>Male</p>
        <input type="checkbox" name="checkbox1">
    </div>
    <div class="female">
        <p>Female</p>
        <input type="checkbox" name="checkbox2">
    </div>
</div>

<div class="dropdown">
    <label for="dropdown">Country:</label>
    <select name="dropdown" id="dropdown">
        <option value="Select">Select an option</option>
        <option value="Denmark">Denmark</option>
        <option value="Poland">Poland</option>
        <option value="Sweden">Sweden</option>
    </select>
</div>

<div class="message">
    Message:
    <br>
    <input type="text" height="300px">
</div>

<div class="checkbox">
    <input type="checkbox" name="checkbox3"> Subscribe?
</div>

<div class="button">
    <button>Submit</button>
</div>
</body>
</html>
