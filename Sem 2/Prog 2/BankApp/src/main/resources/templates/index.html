<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MainPage</title>
    <link rel="stylesheet" th:href="@{style.css}">
</head>
<body>
<div class="container">
    <div class="square" th:each="account : ${accountList}">
        <div>
            <label>Number:</label>
            <span th:text="${account.accountNumber}">Number</span>
        </div>
        <div>
            <label>Name:</label>
            <span th:text="${account.accountName}">Name</span>
        </div>
        <div>
            <label>Balance:</label>
            <span th:text="${account.balance}">Balance</span>
        </div>
    </div>
</div>
<div class="buttons">
    <a th:href="@{/getCreateAccount}" class="btn">Create</a>

    <div class="modify-forms">
        <form th:action="@{/showAccount}" method="get" class="modify-form">
            <input type="number" name="accountNumber" placeholder="Enter Account Number to show" required>
            <button type="submit" class="btn">Show</button>
        </form>

        <form th:action="@{/deleteAccount}" method="post" class="modify-form">
            <input type="number" name="accountNumber" placeholder="Enter Account Number to delete" required>
            <button type="submit" class="btn">Delete</button>
        </form>


    </div>
</div>
