<!-- create.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Car</title>
    <link rel="stylesheet" href="../static/style.css" th:href="@{style.css}">
</head>
<body>
<div class="container">
    <div class="form-container">
        <h2>Create a New Account</h2>
        <form th:action="@{/saveCreateAccount}" method="post">
            <label for="accountNumber">accountNumber:</label>
            <input type="number" id="accountNumber" name="accountNumber" placeholder="Enter Account Number" required>

            <label for="accountName">Name:</label>
            <input type="text" id="accountName" name="accountName" placeholder="Enter accountName" required>

            <label for="balance">balance:</label>
            <input type="number" id="balance" name="balance" placeholder="Enter balance" required>


            <button type="submit">Create Account</button>
        </form>
    </div>
</div>
</body>
</html>
